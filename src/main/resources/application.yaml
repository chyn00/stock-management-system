spring:
  application:
    name: stock-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_management}
    username: ${DB_USERNAME:stock_app}
    password: ${DB_PASSWORD:local_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false

server:
  port: ${SERVER_PORT:8080}

stock:
  tenant-id: ${TENANT_ID:1}
