services:
  postgres:
    image: postgres:17.12
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    environment:
      POSTGRES_DB: stock_management
      POSTGRES_USER: stock_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_app -d stock_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
